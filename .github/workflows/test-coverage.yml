name: Test & Coverage

on:
  push:
    branches: [master, "ci/**", "test/**", "feat/**"]
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.rst'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # required for Codecov OIDC

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental || false }}

    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_LINK_MODE: copy
      DEBIAN_FRONTEND: noninteractive
      NLTK_DATA: ${{ github.workspace }}/.nltk_data

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        include:
          - python-version: "3.14"
            experimental: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "StrongPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            build-essential libpq-dev unixodbc-dev libgdal-dev gdal-bin \
            7zip p7zip-full inkscape pandoc xfonts-75dpi xfonts-base
          
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          sudo dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb || sudo apt-get install -f -y
          rm wkhtmltox_0.12.6.1-3.jammy_amd64.deb

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}

      - name: Install Microsoft ODBC driver for SQL Server
        run: |
          . /etc/os-release
          curl -fsSL -o msprod.deb "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i msprod.deb && rm msprod.deb
          sudo -E apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          odbcinst -q -d

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups --no-install-package gdal

      - name: Install GDAL Python bindings matching system libgdal
        continue-on-error: ${{ matrix.experimental || false }}
        env:
          C_INCLUDE_PATH: /usr/include/gdal
          CPLUS_INCLUDE_PATH: /usr/include/gdal
        run: |
          GDAL_VERSION="$(gdal-config --version)"
          echo "System libgdal: ${GDAL_VERSION}"
          uv pip install setuptools wheel
          uv pip install --no-build-isolation "gdal==${GDAL_VERSION}"
          uv run --no-sync python -c "from osgeo import gdal; print('Python GDAL', gdal.__version__)"

      - name: Show resolved interpreter
        run: uv run --no-sync python -VV

      - name: Download NLTK data
        run: |
          mkdir -p "$NLTK_DATA"
          uv run --no-sync python - <<'EOF'
          import nltk
          pkgs = ["punkt_tab", "punkt", "stopwords"]
          failed = [p for p in pkgs if not nltk.download(p, quiet=True)]
          assert not failed, f"NLTK downloads failed: {failed}"
          EOF

      - name: Run tests with coverage
        env:
          POSTGRES_SERVER: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: testdb
          MSSQL_SERVER: 127.0.0.1
          MSSQL_PORT: 1433
          MSSQL_USER: sa
          MSSQL_PASSWORD: StrongPassword123!
          MSSQL_DB: testdb
        run: uv run --no-sync pytest --junitxml=reports/junit.xml

      - name: Upload reports as artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: reports/coverage.xml
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: ${{ matrix.experimental != true }}

name: Test & Coverage

on:
  push:
    branches: [master, "ci/**", "test/**", "feat/**"]
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.rst'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # required for Codecov OIDC

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-3.13.3
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        include:
          - python-version: "3.14"
            experimental: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "StrongPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpq-dev 7zip p7zip-full inkscape unixodbc-dev pandoc wget xfonts-75dpi xfonts-base
          
          wget https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb || apt-get install -f -y
          rm wkhtmltox_0.12.6.1-3.jammy_amd64.deb

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Download NLTK data
        run: |
          uv run python -c "import nltk; nltk.download('punkt_tab'); nltk.download('punkt')"

      - name: Run tests with coverage
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: testdb
          MSSQL_SERVER: localhost
          MSSQL_PORT: 1433
          MSSQL_USER: sa
          MSSQL_PASSWORD: StrongPassword123!
          MSSQL_DB: testdb
        run: |
          uv run --locked pytest --junitxml=reports/junit.xml

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: reports/coverage.xml
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: ${{ matrix.experimental != true }}

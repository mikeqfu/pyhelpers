[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhelpers"
version = "2.5.1rc1"
description = "An open-source toolkit for facilitating Python users' data manipulation tasks"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Qian Fu", email = "q.fu@bham.ac.uk" }
]
keywords = [
    "Python",
    "Utilities",
    "Data preprocessing",
    "Data manipulation",
    "Python utilities",
    "Python utils",
    "Python utility"
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    "numpy",
    "pandas",
    "psycopg2",
    "pyproj",
    "requests",
    "shapely",
    "sqlalchemy"
]

[project.optional-dependencies]
full = [
    "fastparquet",
    "fiona",
    "folium",
    "gdal",
    "geopandas",
    "joblib",
    "matplotlib",
    "networkx",
    "nltk",
    "odfpy",
    "openpyxl",
    "orjson",
    "pdfkit",
    "pillow",
    "polars",
    "pyarrow",
    "pyodbc",
    "pypandoc",
    "python-rapidjson",
    "rapidfuzz",
    "scikit-learn",
    "scipy",
    "tqdm",
    "ujson",
    "xlsx2csv",
    "xlsxwriter"
]

# Install everything
all = [
    "pyhelpers[full]"
]


[project.urls]
Homepage = "https://github.com/mikeqfu/pyhelpers"
Documentation = "https://pyhelpers.readthedocs.io/en/latest/"
Source = "https://github.com/mikeqfu/pyhelpers"
"Bug Tracker" = "https://github.com/mikeqfu/pyhelpers/issues"


# -----------------------
# Local developer tooling
# -----------------------
[dependency-groups]
dev = [
    "notebook",
    "jsonschema[format]",
    "rfc3987-syntax",
]
docs = [
    "furo",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-new-tab-link",
    "sphinx-toggleprompt"
]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pytest-mock",
]


# -----------------
# UV configuration
# -----------------
[[tool.uv.index]]
name = "geospatial-wheels"
url = "https://nathanjmcdougall.github.io/geospatial-wheels-index/"
explicit = true

[tool.uv.sources]
gdal = [
    { index = "geospatial-wheels", marker = "sys_platform == 'win32'" },
]


# --------------------
# Build configuration
# --------------------
[tool.hatch.build.targets.sdist]
include = [
    "pyhelpers",
    "pyproject.toml",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "README.md"
]
exclude = [
    ".venv",
    "docs",
    "tests",
    "tutorials"
]

[tool.hatch.build.targets.wheel]
packages = ["pyhelpers"]


# Custom metadata section
[tool.custom.metadata]
funder = ""
project_start = "September 2019"
corresponding_author = [
    { name = "Qian Fu", affiliation = "Birmingham Energy Institute, University of Birmingham", email = "q.fu@bham.ac.uk" },
]


# --------------------
# Pytest configuration
# --------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-v",
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pyhelpers",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
]
xfail_strict = true

filterwarnings = [
    "error",
    "ignore:Support for class-based `config` is deprecated:UserWarning",
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
]


# ----------------------
# Coverage configuration
# ----------------------
[tool.coverage.run]
source = ["pyhelpers"]
branch = true
parallel = true
relative_files = true

[tool.coverage.paths]
source = [
    "pyhelpers",
    "*/site-packages/pyhelpers",
    "*/pyhelpers",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Report destinations
[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.html]
directory = "reports/htmlcov"
